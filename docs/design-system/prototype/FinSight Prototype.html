<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinSight — 카드 명세서 경비 분류</title>
<link rel="stylesheet" href="../tokens/fonts.css">
<link rel="stylesheet" href="../tokens/colors.css">
<link rel="stylesheet" href="../tokens/typography.css">
<link rel="stylesheet" href="../tokens/spacing.css">
<link rel="stylesheet" href="../tokens/radius.css">
<link rel="stylesheet" href="../tokens/shadow.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-body);color:var(--color-ink);background:var(--color-canvas)}
a{color:var(--color-primary);text-decoration:none}
a:hover{color:var(--color-primary-active)}
.container{max-width:var(--content-max-width);margin:0 auto;padding:0 32px}
button{font-family:var(--font-body)}
.appbar{position:sticky;top:0;z-index:20;background:var(--color-canvas);border-bottom:1px solid var(--color-hairline);height:64px;display:flex;align-items:center}
.appbar .container{display:flex;align-items:center;justify-content:space-between;width:100%}
.wordmark{font-size:18px;font-weight:700;letter-spacing:-0.3px;display:flex;align-items:center;gap:8px;cursor:pointer}
.wordmark .dot{width:8px;height:8px;border-radius:50%;background:var(--color-primary)}
.navtabs{display:flex;gap:4px}
.navtab{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-pill);font-size:14px;font-weight:600;cursor:pointer;color:var(--color-muted);background:transparent;border:none}
.navtab.active{background:var(--color-surface-strong);color:var(--color-ink)}
.navtab[disabled]{cursor:not-allowed;opacity:.55}
.navtab svg{width:14px;height:14px}
.plan-chip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--color-muted)}
.plan-chip b{color:var(--color-ink);font-family:var(--font-mono);font-weight:600}
.disclaimer{background:var(--color-surface-soft);border-bottom:1px solid var(--color-hairline-soft);padding:10px 0;font-size:13px;color:var(--color-muted)}
.disclaimer .container{display:flex;align-items:center;gap:8px}
.disclaimer svg{width:14px;height:14px;flex-shrink:0}
.hero{padding:96px 0 64px}
.hero h1{font-family:var(--font-display);font-weight:var(--weight-display);font-size:var(--text-display-lg-size);line-height:var(--text-display-lg-lh);letter-spacing:var(--text-display-lg-ls);margin:0 0 20px;max-width:640px}
.hero p.sub{font-size:18px;color:var(--color-body);max-width:520px;margin:0 0 40px;line-height:1.5}
.dropzone{border:2px dashed var(--color-hairline);border-radius:var(--radius-xl);padding:56px 32px;text-align:center;background:var(--color-surface-soft);transition:border-color .15s,background .15s;max-width:640px}
.dropzone.drag{border-color:var(--color-primary);background:#eef3ff}
.dropzone svg{width:40px;height:40px;color:var(--color-muted);margin-bottom:16px}
.dropzone h3{font-size:18px;font-weight:600;margin:0 0 8px}
.dropzone p{font-size:14px;color:var(--color-muted);margin:0 0 24px}
.privacy-row{display:flex;gap:20px;margin-top:24px;font-size:13px;color:var(--color-muted)}
.privacy-row span{display:flex;align-items:center;gap:6px}
.privacy-row svg{width:14px;height:14px}
.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-lg);padding:64px 0 96px}
.steps{display:flex;gap:24px;padding:40px 0 8px;font-size:14px;color:var(--color-muted-soft)}
.steps .step{display:flex;align-items:center;gap:8px}
.steps .step.active{color:var(--color-ink);font-weight:600}
.steps .num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--color-surface-strong);font-size:12px;font-family:var(--font-mono)}
.steps .step.active .num{background:var(--color-primary);color:#fff}
.card{background:var(--color-canvas);border:1px solid var(--color-hairline);border-radius:var(--radius-xl);padding:var(--space-xl)}
.card h2{font-size:var(--text-title-lg-size);font-weight:var(--weight-display);font-family:var(--font-display);margin:0 0 4px;letter-spacing:var(--text-title-lg-ls)}
.map-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--color-hairline-soft)}
.map-row:last-child{border-bottom:none}
.map-label{font-size:14px;font-weight:600;color:var(--color-body)}
.map-preview{font-size:13px;color:var(--color-muted);font-family:var(--font-mono)}
select.map-select{width:100%;height:44px;border-radius:var(--radius-md);border:1px solid var(--color-hairline);padding:0 12px;font-size:14px;font-family:var(--font-body);background:#fff;color:var(--color-ink)}
.summary-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:var(--space-lg);margin-bottom:var(--space-xl)}
.stat-card{background:var(--color-surface-soft);border-radius:var(--radius-lg);padding:24px}
.stat-card .label{font-size:13px;color:var(--color-muted);margin-bottom:8px}
.stat-card .value{font-family:var(--font-mono);font-size:28px;font-weight:500}
.bars{display:flex;align-items:flex-end;gap:10px;height:64px;margin-top:16px}
.bars .bar{flex:1;background:var(--color-primary);border-radius:4px 4px 0 0;opacity:.85}
.merchant-list{list-style:none;margin:0;padding:0;font-size:14px}
.merchant-list li{display:flex;justify-content:space-between;padding:6px 0;color:var(--color-body)}
.merchant-list li b{font-family:var(--font-mono);font-weight:500;color:var(--color-ink)}
table.tx{width:100%;border-collapse:collapse;font-size:14px}
table.tx th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--color-muted-soft);font-weight:600;padding:0 12px 10px;border-bottom:1px solid var(--color-hairline)}
table.tx td{padding:12px 12px;border-bottom:1px solid var(--color-hairline-soft);vertical-align:middle}
table.tx td.num{text-align:right;font-family:var(--font-mono)}
table.tx tr.needs-review{background:#fffdf5}
.status-tag{display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:none;background:none;padding:0;font-family:var(--font-body);font-size:14px}
.status-tag .dot{width:7px;height:7px;border-radius:50%}
.status-tag.biz{color:var(--color-ink)}
.status-tag.biz .dot{background:var(--color-semantic-up)}
.status-tag.personal{color:var(--color-muted)}
.status-tag.personal .dot{background:var(--color-gray-500,#a8acb3)}
.status-tag.review{color:var(--color-ink);font-weight:600}
.status-tag.review .dot{background:var(--color-accent-yellow)}
select.acct{border:1px solid var(--color-hairline);border-radius:var(--radius-sm);height:32px;padding:0 8px;font-size:13px;font-family:var(--font-body);background:#fff;color:var(--color-ink)}
.confidence{color:var(--color-muted-soft);font-family:var(--font-mono);font-size:13px}
.lock-banner{margin-top:24px;background:var(--color-surface-soft);border:1px solid var(--color-hairline);border-radius:var(--radius-lg);padding:24px 28px;display:flex;align-items:center;gap:20px}
.lock-banner svg{width:28px;height:28px;color:var(--color-muted);flex-shrink:0}
.lock-banner h4{margin:0 0 4px;font-size:15px;font-weight:600}
.lock-banner p{margin:0;font-size:13px;color:var(--color-muted)}
.lock-banner .spacer{flex:1}
.connect-wrap{max-width:420px;margin:96px auto;text-align:center}
.gcard{border:1px solid var(--color-hairline);border-radius:var(--radius-xl);padding:40px 32px}
.gcircle{width:56px;height:56px;border-radius:50%;background:var(--color-surface-strong);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:20px;font-weight:700}
.gcard h3{margin:0 0 8px;font-size:18px}
.gcard p.mail{font-size:14px;color:var(--color-muted);margin:0 0 24px}
.consent-list{text-align:left;font-size:13px;color:var(--color-body);margin:0 0 28px;padding:16px;background:var(--color-surface-soft);border-radius:var(--radius-md);list-style:none}
.consent-list li{display:flex;gap:8px;padding:4px 0}
.consent-list svg{width:14px;height:14px;color:var(--color-semantic-up);flex-shrink:0;margin-top:2px}
.spinner{width:32px;height:32px;border:3px solid var(--color-surface-strong);border-top-color:var(--color-primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 20px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--color-surface-dark);color:#fff;padding:14px 22px;border-radius:var(--radius-pill);font-size:14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-soft);z-index:50;animation:toastin .2s ease-out}
.toast svg{width:16px;height:16px;color:var(--color-semantic-up)}
@keyframes toastin{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.modal-overlay{position:fixed;inset:0;background:rgba(10,11,13,.5);display:flex;align-items:center;justify-content:center;z-index:60}
.modal-card{background:#fff;border-radius:var(--radius-xl);padding:40px;max-width:680px;width:92%;position:relative}
.modal-close{position:absolute;top:20px;right:20px;background:var(--color-surface-strong);border:none;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.modal-close svg{width:16px;height:16px}
.pricing-row{display:flex;gap:20px;justify-content:center;margin-top:24px}
.qa-lock{text-align:center;padding:64px 0 32px}
.qa-lock svg{width:36px;height:36px;color:var(--color-muted);margin-bottom:16px}
.qa-lock h3{font-size:22px;margin:0 0 8px;font-family:var(--font-display);font-weight:var(--weight-display)}
.qa-lock p{color:var(--color-muted);margin:0 0 8px;font-size:15px}
.chat-wrap{max-width:760px;margin:0 auto;padding:32px 0 140px}
.msg{display:flex;margin-bottom:16px}
.msg.user{justify-content:flex-end}
.bubble{max-width:70%;padding:12px 18px;border-radius:var(--radius-lg);font-size:14px;line-height:1.5}
.msg.user .bubble{background:var(--color-ink);color:#fff;border-radius:var(--radius-lg) var(--radius-lg) 4px var(--radius-lg)}
.msg.ai .bubble{background:var(--color-surface-soft);color:var(--color-ink);border-radius:var(--radius-lg) var(--radius-lg) var(--radius-lg) 4px}
.bubble b{font-family:var(--font-mono)}
.quick-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.quick-chip{border:1px solid var(--color-hairline);background:#fff;border-radius:var(--radius-pill);padding:8px 16px;font-size:13px;cursor:pointer;color:var(--color-body)}
.quick-chip:hover{background:var(--color-surface-soft)}
.chat-input-bar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(to top,#fff 60%,rgba(255,255,255,0));padding:24px 0 32px}
.chat-input{max-width:760px;margin:0 auto;display:flex;gap:10px;background:#fff;border:1px solid var(--color-hairline);border-radius:var(--radius-pill);padding:6px 6px 6px 20px;align-items:center}
.chat-input input{flex:1;border:none;outline:none;font-size:14px;font-family:var(--font-body)}
.chat-input button{width:40px;height:40px;border-radius:50%;background:var(--color-primary);border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.chat-input button svg{width:16px;height:16px}
.table-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.usage-note{font-size:13px;color:var(--color-muted)}
.usage-note b{color:var(--color-ink)}
.section-title{font-size:14px;font-weight:600;color:var(--color-muted);text-transform:uppercase;letter-spacing:.4px;margin:0 0 16px}
@media print{
.appbar,.disclaimer,.table-toolbar,.no-print{display:none!important}
body{background:#fff}
table.tx tr.needs-review{background:#fff}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="finsight-data.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../components-bundle.js"></script>
<script type="text/babel" data-presets="react" src="finsight-app.jsx"></script>
</body>
</html>
